name: Deploy Market Valuation

on:
  push:
    branches: [main]
    paths:
      - 'component4-market-valuation/**'
      - '.github/workflows/deploy-market-valuation.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: watinakama-market-valuation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./component4-market-valuation
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Azure App Service pulls the new :latest image automatically via the
      # Docker Hub webhook configured on this repo's Webhooks tab - no Azure
      # credentials needed here.
