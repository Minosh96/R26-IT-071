name: Test VIN Authentication

on:
  pull_request:
    branches: [main]
    paths:
      - 'component1-vin-authentication/**'
      - '.github/workflows/test-vin-auth.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: component1-vin-authentication
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            component1-vin-authentication/requirements.txt
            component1-vin-authentication/requirements-dev.txt

      # opencv-python needs libGL / glib at runtime
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
