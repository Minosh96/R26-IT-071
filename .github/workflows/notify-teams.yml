name: Notify Teams on PR

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post card to Teams
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          jq -n \
            --arg title "$TITLE" --arg num "$NUMBER" \
            --arg author "$AUTHOR" --arg url "$URL" --arg repo "$REPO" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    { type: "TextBlock", size: "Medium", weight: "Bolder",
                      text: ("🔀 PR #" + $num + ": " + $title) },
                    { type: "FactSet", facts: [
                        { title: "Repository", value: $repo },
                        { title: "Opened by", value: $author }
                    ]}
                  ],
                  actions: [
                    { type: "Action.OpenUrl", title: "View pull request", url: $url }
                  ]
                }
              }]
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
