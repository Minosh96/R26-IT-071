name: Component 4 - Market Valuation

on:
  push:
    paths:
      - "component4-market-valuation/**"
      - ".github/workflows/component4-valuation.yml"
  pull_request:
    paths:
      - "component4-market-valuation/**"
      - ".github/workflows/component4-valuation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: component4-market-valuation
    env:
      API_SECRET_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: component4-market-valuation/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check the committed model is present
        run: test -f models/saved/market_model.joblib && test -f models/saved/market_model_meta.json

      - name: Run tests
        run: pytest -v

      - name: Start under Gunicorn and call the API
        run: |
          gunicorn --bind 127.0.0.1:5004 --workers 1 --timeout 120 api.app:app &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5004/api/v1/health && break; sleep 2; done
          curl -sf http://127.0.0.1:5004/api/v1/health | grep -q '"models_loaded": *true'
          curl -sf -X POST http://127.0.0.1:5004/api/v1/valuate \
            -H "Authorization: Bearer $API_SECRET_TOKEN" -H "Content-Type: application/json" \
            -d '{"maf_year":2015,"reg_year":2015,"mileage_km":100000,"previous_owners":2,"is_reconditioned":0,"power_shutters":1,"power_mirrors":0,"listed_price_million":4.0,"vin_status":"original"}' \
            | grep -q '"status": *"success"'
